    "/dashboard": {
      "get": {
        "operationId": "dashboard",
        "summary": "Implemented: dashboard",
        "x-implementation-status": "implemented",
        "x-roles": [
          "Admin",
          "Staff",
          "Viewer"
        ],
        "security": [
          {
            "cookieSession": []
          }
        ],
        "description": "One consistent read snapshot. Active counts exclude archived products: low stock includes equality and zero; out-of-stock counts quantity=0. Alerts are active-only, ordered quantity ASC then product_id ASC (zero first), API bounded to 100; dashboard initially displays five and links to the full filtered inventory. Total units sums quantities, not inventory value. Admin/Staff activity aggregates all movements (including opening stock, originals, reversals, archived products and inactive actors) over all rows in 7/30 Manila calendar days including today. SQL UTC indexed half-open range, zero-filled daily rows, exact decimal-string totals. Units received/issued are stock activity, never revenue/profit. Viewer does not receive activity or recent movements.",
