    "title": "BizStock API",
    "version": "1.0.0",
    "description": "39 operations implemented on local MariaDB through the authorized UI/profile extension: authentication, lookups, products, movements/history, dashboard, reports/CSV and Admin accounts/reset/audit and secure private profile/product images. All documented operations implemented. No simulated business success. JSON writes max 65536 bytes; queries 4096 bytes. Incoming request IDs ignored. MySQL 8.4 and production HTTPS verification pending."
