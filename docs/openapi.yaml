        "name": "bizstock_session",
        "description": "Implemented same-origin private server session. Production requires HTTPS, Secure/HttpOnly/SameSite=Lax; local/test HTTP exception only. Strict cookie-only IDs rotate after login/password change. Idle 1800 seconds/absolute 28800 seconds by default. Current active status, role and session_version checked each protected request. No public signup or browser token storage."
      },
      "csrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Implemented session-bound CSRF on all mutations including login/logout; obtain /auth/csrf. Rotate cached token after login/password change/logout. No CORS or localStorage. Login/password-change buckets: 5 attempts/account and 30/peer in 5 minutes, persistent and independent; 429 Retry-After."
      }
